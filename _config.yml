  I am currently a Machine Learning Engineer at [Qualcomm AI Research](https://www.qualcomm.com/research/artificial-intelligence), where I focus on **model optimization and model efficiency**. I previously served as a Research Resident at both Qualcomm and VinAI, where I worked under the supervision of [Dr. Khoi Nguyen](https://www.khoinguyen.org/) and [Dr. Rang Nguyen](https://rangnguyen.github.io/).

